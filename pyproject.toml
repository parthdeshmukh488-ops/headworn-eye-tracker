[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "headgaze"
version = "0.1.0"
description = "Head-worn eye tracker: visible-light pupil tracking with ArUco screen mapping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parth Deshmukh" }]
keywords = ["eye-tracking", "gaze", "head-mounted", "aruco", "open-hardware"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

# The core carries numpy only. Everything that needs a camera, a GUI toolkit
# or a physics engine is an extra, which is what lets the test suite run on a
# machine with none of them attached.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
camera = ["opencv-python>=4.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]
all = ["opencv-python>=4.8", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
